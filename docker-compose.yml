version: '3.9'

networks:
  chainloyalty-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:15-alpine
    container_name: chainloyalty-postgres
    environment:
      POSTGRES_USER: chainloyalty
      POSTGRES_PASSWORD: chainloyalty
      POSTGRES_DB: chainloyalty
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chainloyalty-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainloyalty"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chainloyalty-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chainloyalty-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes
